# The app inside a simulated Discord Activity, for local development:
#   docker compose -f compose.activity.yml up --build
# then open http://localhost:3333 (see dev/activity-sim/README.md).
name: pomopensource-activity

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pomopensource
    volumes:
      - db:/var/lib/mysql

  # The production image, configured as the chart configures it for Discord.
  app:
    build: .
    depends_on: [db]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # A fixed key, so restarting keeps everyone signed in. Local only.
      APP_KEY: "base64:dl3t1PnugBQa8LRGWZcWG9Ext87UNI38Mx5dMQ7h0/E="
      APP_URL: http://127.0.0.1:3333
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: pomopensource
      DB_USERNAME: root
      DB_PASSWORD: root
      DISCORD_CLIENT_ID: simulated-client
      DISCORD_CLIENT_SECRET: simulated-secret
      DISCORD_API_URL: http://discord:3334/api
      SESSION_SAME_SITE: none
      SESSION_SECURE_COOKIE: "true"
      SESSION_PARTITIONED_COOKIE: "true"

  # The Discord client and its proxy around the Activity.
  discord:
    build: dev/activity-sim
    depends_on: [app]
    environment:
      APP_UPSTREAM: http://app
      DISCORD_CLIENT_ID: simulated-client
    ports:
      - "3333:3333"

volumes:
  db:
